# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
 branches:
    include:
    - master
    - release/*

pool:
  vmImage: 'ubuntu-latest'

variables:
- name: solution
  value: '**/*.sln'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- name: Major
  value: '3'
- name: Minor
  value: '4'
- name: Patch
  value: $[counter(variables['BuildID'], 0)]
- name: SemanticVersion
  value: $(Major).$(Minor).$(Patch)
- name: SemanticVersionPack
  ${{ if and(  startsWith(variables['Build.SourceBranch'], 'refs/heads/release'), ne( variables['Build.Reason'], 'PullRequest' )  ) }}:
    value: $(Major).$(Minor).$(Patch)
  ${{ if and(  startsWith(variables['Build.SourceBranch'], 'refs/heads/master'),  ne( variables['Build.Reason'], 'PullRequest' )  ) }}:
    value: $(Major).$(Minor).$(Patch)-prerelease
  ${{ if eq( variables['Build.Reason'], 'PullRequest' )  }}:
    value: $(Major).$(Minor).$(Patch)-alpha
- name: PublishPackage
  ${{ if and(  startsWith(variables['Build.SourceBranch'], 'refs/heads/release'), ne( variables['Build.Reason'], 'PullRequest' )  ) }}:
    value: 'true'
  ${{ if and(  startsWith(variables['Build.SourceBranch'], 'refs/heads/master'),  ne( variables['Build.Reason'], 'PullRequest' )  ) }}:
    value: 'true'
  ${{ if  eq( variables['Build.Reason'], 'PullRequest' )  }}:
    value: 'false'

steps:
- script: echo $(SemanticVersion)
- script: echo $(SemanticVersionPack)
- script: echo $(PublishPackage) 

#Set the assembly file and version numbers to be the build number
- task: PowerShell@2
  displayName: 'Set SemanticVersion  for CA.Blocks.DataAccess'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.DataAccess/'
    script: '((Get-Content -path CA.Blocks.DataAccess.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.DataAccess.csproj'

- template: set-semantic-version.yaml
  parameters:
    SemanticVersion: "$(SemanticVersion)"
    ProjectFile: "CA.Blocks.DataAccess.Extensions.Translators.Json"
    
- task: PowerShell@2
  displayName: 'Set SemanticVersion for CA.Blocks.DataAccess.Extensions.Config.Json'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.DataAccess.Extensions.Config.Json/'
    script: '((Get-Content -path CA.Blocks.DataAccess.Extensions.Config.Json.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.DataAccess.Extensions.Config.Json.csproj'

- task: PowerShell@2
  displayName: 'Set SemanticVersion for CA.Blocks.DataAccess.Extensions.Translators.NUlid'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.DataAccess.Extensions.Translators.NUlid/'
    script: '((Get-Content -path CA.Blocks.DataAccess.Extensions.Translators.NUlid.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.DataAccess.Extensions.Translators.NUlid.csproj'
- task: PowerShell@2

  displayName: 'Set SemanticVersion for CA.Blocks.DataAccess.Model'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.DataAccess.Model/'
    script: '((Get-Content -path CA.Blocks.DataAccess.Model.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.DataAccess.Model.csproj'

- task: PowerShell@2
  displayName: 'Set SemanticVersion for CA.Blocks.SqliteDataAccess'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.SqliteDataAccess/'
    script: '((Get-Content -path CA.Blocks.SqliteDataAccess.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.SqliteDataAccess.csproj'

- task: PowerShell@2
  displayName: 'Set SemanticVersion for CA.Blocks.SQLServerDataAccess'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.SQLServerDataAccess/'
    script: '((Get-Content -path CA.Blocks.SQLServerDataAccess.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.SQLServerDataAccess.csproj'

- task: PowerShell@2
  displayName: 'Set SemanticVersion for CA.Blocks.OdbcDataAccess'
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)/CA.Blocks.OdbcDataAccess/'
    script: '((Get-Content -path CA.Blocks.OdbcDataAccess.csproj -Raw) -replace "987.654.3210","$(SemanticVersion)") | Set-Content -Path CA.Blocks.OdbcDataAccess.csproj'

- task: NuGetToolInstaller@1

- task: DotNetCoreCLI@2
  displayName: 'Restore packages'
  continueOnError: false
  inputs:
        command: restore

# WE have a dependency on SQL so only run the DataAccessUnitTests and SqliteDataAccessUnitTests tests which can run in memory

- task: DotNetCoreCLI@2
  displayName: 'Build and Test'
  continueOnError: false
  inputs:
       command: test
       projects: |
            **/*.csproj
            !**/*SQLServerDataAccessUnitTests.csproj
            !**/*MySQLDataAccessUnitTests.csproj
            !**/*OdbcDataAccessUnitTests.csproj
       arguments: >
          --configuration $(BuildConfiguration)
          --collect "Code coverage"
          /p:ExcludeByAttribute=Obsolete

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '**/*.csproj;!**/*Tests.csproj;!**/*Benchmarks.csproj'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: byEnvVar
    versionEnvVar : SemanticVersionPack
    includesymbols: true

- task: PublishBuildArtifacts@1    
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'

- task: NuGetCommand@2
  displayName: 'NuGet Push' 
  condition: "eq('true', variables['PublishPackage'])"
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
    nuGetFeedType: external
    publishFeedCredentials: CA.Blocks.NugetFeed 